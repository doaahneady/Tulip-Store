<!DOCTYPE html>
<html>
<head>
    <title>CS Dashboard Charts Test</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.min.js"></script>
    <style>
        body { background: #1e1b4b; color: white; font-family: Arial; padding: 20px; }
        .chart-container { background: rgba(255,255,255,0.1); padding: 20px; margin: 20px 0; border-radius: 10px; }
        canvas { max-height: 300px; }
    </style>
</head>
<body>
    <h1>CS Dashboard Charts Test</h1>
    
    <div class="chart-container">
        <h3>Timeline Chart Test</h3>
        <canvas id="testTimeline"></canvas>
    </div>
    
    <div class="chart-container">
        <h3>Status Chart Test</h3>
        <canvas id="testStatus"></canvas>
    </div>
    
    <div class="chart-container">
        <h3>Priority Chart Test</h3>
        <canvas id="testPriority"></canvas>
    </div>

    <script>
        // Test data
        const timelineData = [
            {date: 'Dec 5', count: 12, resolved: 8},
            {date: 'Dec 6', count: 15, resolved: 10},
            {date: 'Dec 7', count: 8, resolved: 12},
            {date: 'Dec 8', count: 20, resolved: 15},
            {date: 'Dec 9', count: 18, resolved: 16},
            {date: 'Dec 10', count: 22, resolved: 18},
            {date: 'Dec 11', count: 25, resolved: 20}
        ];
        
        const statusData = [5, 12, 3, 18, 8];
        const statusLabels = ['Open', 'In Progress', 'Waiting Customer', 'Resolved', 'Closed'];
        
        const priorityData = [15, 20, 8, 3];
        const priorityLabels = ['Low', 'Medium', 'High', 'Urgent'];

        // Set Chart.js defaults for dark theme
        Chart.defaults.color = '#ffffff';
        Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)';

        // Timeline Chart
        new Chart(document.getElementById('testTimeline'), {
            type: 'line',
            data: {
                labels: timelineData.map(item => item.date),
                datasets: [{
                    label: 'Created Tickets',
                    data: timelineData.map(item => item.count),
                    borderColor: '#60a5fa',
                    backgroundColor: 'rgba(96, 165, 250, 0.2)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4
                }, {
                    label: 'Resolved Tickets',
                    data: timelineData.map(item => item.resolved),
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.2)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { labels: { color: '#ffffff' } }
                },
                scales: {
                    y: { 
                        beginAtZero: true,
                        grid: { color: 'rgba(255, 255, 255, 0.1)' },
                        ticks: { color: 'rgba(255, 255, 255, 0.8)' }
                    },
                    x: { 
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: 'rgba(255, 255, 255, 0.8)' }
                    }
                }
            }
        });

        // Status Chart
        new Chart(document.getElementById('testStatus'), {
            type: 'doughnut',
            data: {
                labels: statusLabels,
                datasets: [{
                    data: statusData,
                    backgroundColor: ['#fbbf24', '#60a5fa', '#f87171', '#4ade80', '#9ca3af'],
                    borderWidth: 2,
                    borderColor: 'rgba(255, 255, 255, 0.1)'
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { 
                        position: 'bottom',
                        labels: { color: '#ffffff', padding: 20 }
                    }
                }
            }
        });

        // Priority Chart
        new Chart(document.getElementById('testPriority'), {
            type: 'bar',
            data: {
                labels: priorityLabels,
                datasets: [{
                    label: 'Tickets',
                    data: priorityData,
                    backgroundColor: ['#60a5fa', '#fbbf24', '#f87171', '#f472b6'],
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: { 
                        beginAtZero: true,
                        grid: { color: 'rgba(255, 255, 255, 0.1)' },
                        ticks: { color: 'rgba(255, 255, 255, 0.8)' }
                    },
                    x: { 
                        grid: { display: false },
                        ticks: { color: 'rgba(255, 255, 255, 0.8)' }
                    }
                }
            }
        });

        console.log('All charts loaded successfully!');
    </script>
</body>
</html>
