<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tulip Store - نظام التتبع</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo {
            font-size: 100px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            color: #2d3748;
            font-size: 36px;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .subtitle {
            color: #718096;
            font-size: 18px;
            margin-bottom: 50px;
            line-height: 1.6;
        }

        .options {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }

        .option-card {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            padding: 30px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
            text-decoration: none;
            display: block;
        }

        .option-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            border-color: #667eea;
        }

        .option-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .option-title {
            color: #2d3748;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .option-desc {
            color: #4a5568;
            font-size: 15px;
            line-height: 1.5;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e2e8f0;
            color: #718096;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 28px;
            }

            .logo {
                font-size: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌷</div>
        <h1>Tulip Store</h1>
        <p class="subtitle">
            نظام تتبع GPS للسائقين<br>
            Driver GPS Tracking System
        </p>

        <div class="options">
            <a href="/driver-start.html" class="option-card">
                <div class="option-icon">🚗</div>
                <div class="option-title">أنا سائق</div>
                <div class="option-desc">
                    ابدأ التتبع وشارك موقعك مع المشرف
                </div>
                <div class="badge">للسائقين</div>
            </a>

            <a href="/delivery/supervisor/dashboard" class="option-card">
                <div class="option-icon">📊</div>
                <div class="option-title">أنا مشرف</div>
                <div class="option-desc">
                    تتبع جميع السائقين على الخريطة
                </div>
                <div class="badge">للمشرفين</div>
            </a>
        </div>

        <div class="footer">
            <strong>للسائقين:</strong> اضغط على "أنا سائق" لبدء التتبع<br>
            <strong>للمشرفين:</strong> اضغط على "أنا مشرف" لفتح لوحة التحكم
        </div>
    </div>
</body>
</html>
